[package]
name = "winwf"
version = "1.0.0"
edition = "2024"
publish = false
description = "Auto potion navigation for Minecraft Bedrock 1.16.100 with an Overhook on/off menu (Alt+G)"

[lib]
crate-type = ["cdylib"]

[features]
# exports test controls for tests/harness.c; never ship a build with this
harness = []

[dependencies]
log = "0.4"
# qcountel/overhook @ 722c43f, plus a fix for a null-original race when the
# Present hook is enabled (see vendor/overhook/src/hooks/mod.rs::hook)
overhook = { path = "vendor/overhook" }

[dependencies.windows]
version = "0.62"
features = [
    "ApplicationModel_Core",
    "Foundation",
    "System",
    "UI_Core",
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
]

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"
strip = "symbols"
